name: hermes-zvec-memory
repo: https://github.com/r0b0tlab/hermes-zvec-memory
# Exact 40-hex pin, mandatory (see plugin-catalog/README.md). This is the v0.2.0
# release commit: git rev-list -n1 v0.2.0 in the plugin repo.
sha: 36fdba76e1693ac8f9da14e0f0f88438aba43757
# The plugin lives in a subdirectory of the repository; the admission CI looks
# for plugin.yaml at <repo>/<subdir> and installs from there.
subdir: zvec-memory
description: "Local-first memory over a zg-indexed Markdown vault: hybrid semantic and keyword recall with file:line citations, no cloud."
maintainer: am423
tier: community
docs_url: https://github.com/r0b0tlab/hermes-zvec-memory/blob/main/docs/maintenance.md
platforms: []
# Capabilities as registered at the pinned commit (verified, not aspirational):
#   tools  — ZvecMemoryProvider.get_tool_schemas() returns memory_search, memory_store
#   hooks  — plugin.yaml declares on_session_end, on_memory_write
#   env    — nothing is required; every setting has a default (engine paths are
#            generated by post_setup, the engine token file is created by the engine)
capabilities:
  provides_tools:
    - memory_search
    - memory_store
  provides_hooks:
    - on_session_end
    - on_memory_write
  provides_middleware: []
  requires_env: []
